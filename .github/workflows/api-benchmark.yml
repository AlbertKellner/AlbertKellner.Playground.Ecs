name: Executar Benchmark da API

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]

jobs:
  api-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore src/Playground.Ecs.sln
      - name: Run API benchmark
        run: dotnet run --project src/Playground.ApiBenchmarks/Playground.ApiBenchmarks.csproj -c Release -- --filter '*'
